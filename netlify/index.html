<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://damnum.consciencia.eco.br/">
    <title>DAMNUM mudou de endereço</title>
    <style>
        :root { --fundo: #f4f8f4; --cartao: #ffffff; --texto: #222; --verde: #2c5530; --verde-claro: #4a7c59; --borda: #c9d6c9; }
        @media (prefers-color-scheme: dark) {
            :root { --fundo: #121a14; --cartao: #1b261e; --texto: #e6ece7; --verde: #9fd0a8; --verde-claro: #7fb88b; --borda: #2f4234; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: var(--fundo); color: var(--texto); font-family: Georgia, "Times New Roman", serif; line-height: 1.6; }
        main { max-width: 560px; width: 100%; background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px; padding: 32px 28px; text-align: center; }
        h1 { color: var(--verde); font-size: 1.6em; margin: 0 0 12px; letter-spacing: 0.02em; }
        p { margin: 0 0 18px; }
        a.botao { display: inline-block; background: var(--verde-claro); color: #fff; text-decoration: none; font-family: system-ui, sans-serif;
                  font-weight: 600; padding: 12px 22px; border-radius: 6px; }
        a.botao:hover, a.botao:focus-visible { background: var(--verde); color: #fff; }
        .endereco { font-family: system-ui, sans-serif; font-size: 0.95em; word-break: break-all; }
        .endereco a { color: var(--verde); }
    </style>
</head>
<body>
    <main>
        <h1>O DAMNUM mudou de endereço</h1>
        <p>A calculadora de valoração de danos ambientais decorrentes de desmatamento ilegal não é mais publicada aqui. A versão em uso está em:</p>
        <p class="endereco"><a href="https://damnum.consciencia.eco.br/">https://damnum.consciencia.eco.br</a></p>
        <p><a class="botao" href="https://damnum.consciencia.eco.br/">Abrir o DAMNUM</a></p>
    </main>
</body>
</html>
